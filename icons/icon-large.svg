<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 180 180">
  <!-- 手機主畫面用的圖示（轉成 apple-touch-icon.png）。一台雙門跑車的俯視圖、車頭朝上：
       銀色車殼、深色玻璃、紅色雙條紋、黑色尾翼，車底一圈紅色光暈，配色和 css/style.css 一致。
       車殼左右對稱，改外形時左右的座標要一起改（左邊的 x 等於 180 減右邊的 x）。
       iOS 會自己把四個角切成圓角，所以不畫外框 -->
  <defs>
    <path id="body" d="M90 12C104 12 116 13 122 20C127 26 129 36 129 46C129 62 126 76 126 92C126 108 130 118 130 132C130 146 129 156 125 162C121 167 106 168 90 168C74 168 59 167 55 162C51 156 50 146 50 132C50 118 54 108 54 92C54 76 51 62 51 46C51 36 53 26 58 20C64 13 76 12 90 12Z"/>
    <clipPath id="body-clip"><use xlink:href="#body"/></clipPath>
    <radialGradient id="glow" cx="90" cy="90" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8114b" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#e8114b" stop-opacity="0.3"/>
      <stop offset="0.82" stop-color="#b3002f" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#b3002f" stop-opacity="0"/>
    </radialGradient>
    <!-- 車殼的烤漆：中間亮、兩側暗，看起來有弧度 -->
    <linearGradient id="paint" x1="50" y1="0" x2="130" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63676d"/>
      <stop offset="0.13" stop-color="#b4b8be"/>
      <stop offset="0.34" stop-color="#eeeff1"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.66" stop-color="#eeeff1"/>
      <stop offset="0.87" stop-color="#b4b8be"/>
      <stop offset="1" stop-color="#63676d"/>
    </linearGradient>
    <!-- 車頭與車尾往下收的陰影 -->
    <linearGradient id="ends" x1="0" y1="12" x2="0" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="0.1" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46505e"/>
      <stop offset="0.45" stop-color="#151920"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="glass-rear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d11"/>
      <stop offset="1" stop-color="#2c333e"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d52"/>
      <stop offset="0.48" stop-color="#24262a"/>
      <stop offset="0.52" stop-color="#0c0c0d"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="12" x2="0" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c2083b"/>
      <stop offset="0.3" stop-color="#f2245c"/>
      <stop offset="0.7" stop-color="#e8114b"/>
      <stop offset="1" stop-color="#b3002f"/>
    </linearGradient>
    <pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.7" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="4.5" cy="4.5" r="0.7" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <filter id="blur-glow" x="-50%" y="-30%" width="200%" height="160%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="blur-shadow" x="-30%" y="-20%" width="160%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="180" height="180" fill="#000000"/>
  <rect width="180" height="180" fill="url(#mesh)"/>
  <rect width="180" height="180" fill="url(#glow)"/>

  <!-- 整台車橫向放寬一成：寬體的比例，在正方形的圖示裡也比較飽滿 -->
  <g transform="translate(90 0) scale(1.1 1) translate(-90 0)">

  <!-- 車底的紅光與影子 -->
  <use xlink:href="#body" fill="#ff1f55" filter="url(#blur-glow)"/>
  <use xlink:href="#body" fill="#000000" fill-opacity="0.75" filter="url(#blur-shadow)"/>

  <!-- 輪胎：只有外側露出車殼 -->
  <g fill="#0b0b0c" stroke="#d7d9dc" stroke-opacity="0.4" stroke-width="1">
    <rect x="118" y="32" width="15" height="29" rx="4"/>
    <rect x="47" y="32" width="15" height="29" rx="4"/>
    <rect x="119" y="118" width="15" height="29" rx="4"/>
    <rect x="46" y="118" width="15" height="29" rx="4"/>
  </g>

  <!-- 後視鏡 -->
  <g fill="#b4b8be" stroke="#000000" stroke-opacity="0.45" stroke-width="0.8">
    <ellipse cx="129" cy="73.5" rx="5.5" ry="2.8"/>
    <ellipse cx="51" cy="73.5" rx="5.5" ry="2.8"/>
  </g>

  <!-- 車殼 -->
  <use xlink:href="#body" fill="url(#paint)"/>

  <g clip-path="url(#body-clip)">
    <!-- 紅色雙條紋，從車頭到車尾 -->
    <rect x="82.5" y="10" width="6" height="160" fill="url(#red)"/>
    <rect x="91.5" y="10" width="6" height="160" fill="url(#red)"/>
    <use xlink:href="#body" fill="url(#ends)"/>

    <!-- 引擎蓋的接縫與摺線 -->
    <g fill="none" stroke="#000000" stroke-linecap="round">
      <path d="M57 31Q90 23 123 31" stroke-opacity="0.26" stroke-width="1"/>
      <path d="M72 27L67 64" stroke-opacity="0.16" stroke-width="1"/>
      <path d="M108 27L113 64" stroke-opacity="0.16" stroke-width="1"/>
    </g>

    <!-- 頭燈與進氣口 -->
    <g fill="#ffffff" stroke="#2a2c30" stroke-width="0.9" stroke-linejoin="round">
      <path d="M103 15.6C111 16 118 17.6 122.4 21.4C124.6 23.6 125.6 26 126 28.6C119 25.4 111 22.6 103 21.6Z"/>
      <path d="M77 15.6C69 16 62 17.6 57.6 21.4C55.4 23.6 54.4 26 54 28.6C61 25.4 69 22.6 77 21.6Z"/>
    </g>
    <path d="M80 14.4Q90 13 100 14.4L98.5 18.6Q90 17.6 81.5 18.6Z" fill="#0b0b0c"/>

    <!-- 尾燈 -->
    <g fill="#ff1f55" stroke="#7a0020" stroke-width="0.6" stroke-linejoin="round">
      <path d="M102 165.8C111 165.6 119 164.8 124.8 160.4L122 158.4C117 161.2 110 162.2 102 162.4Z"/>
      <path d="M78 165.8C69 165.6 61 164.8 55.2 160.4L58 158.4C63 161.2 70 162.2 78 162.4Z"/>
    </g>
  </g>

  <!-- 車窗：前擋、兩側、後擋 -->
  <g stroke="#000000" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round">
    <path d="M60 68Q90 58 120 68L114 86Q90 81 66 86Z" fill="url(#glass)"/>
    <path d="M116 87L121 76.5L122.5 122L121 127L115.5 115Z" fill="#0d1014"/>
    <path d="M64 87L59 76.5L57.5 122L59 127L64.5 115Z" fill="#0d1014"/>
    <path d="M67 116Q90 119 113 116L118 130Q90 136 62 130Z" fill="url(#glass-rear)"/>
  </g>
  <!-- 車頂的邊線 -->
  <g fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="0.8">
    <path d="M114.6 86.2L113.6 115.9"/>
    <path d="M65.4 86.2L66.4 115.9"/>
  </g>

  <!-- 尾翼：支架、翼片、兩側端板 -->
  <g fill="#1d1e21">
    <rect x="73.5" y="139" width="3.5" height="9"/>
    <rect x="103" y="139" width="3.5" height="9"/>
  </g>
  <rect x="50" y="146" width="80" height="10.5" rx="1.5" fill="url(#wing)" stroke="#c9ccd1" stroke-width="1.1"/>
  <g fill="#1d1e21" stroke="#c9ccd1" stroke-width="1.1">
    <rect x="47" y="142.5" width="5.5" height="17.5" rx="1"/>
    <rect x="127.5" y="142.5" width="5.5" height="17.5" rx="1"/>
  </g>

  <!-- 車殼外緣的暗線 -->
  <use xlink:href="#body" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1"/>

  </g>
</svg>
